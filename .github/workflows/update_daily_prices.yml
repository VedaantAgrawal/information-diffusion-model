name: Update Daily Equity & Index Prices

# WHY THIS SCHEDULE:
# NSE market close is 3:30 PM IST. We wait until 6:00 PM IST (12:30 UTC,
# since IST = UTC+5:30) before pulling data — this gives Yahoo Finance
# time to finalize the day's closing bar rather than racing it right at
# the close. This runs once per trading day, not intraday, because daily
# OHLCV bars don't change intraday the way an option chain does — see
# 03_options_chain.py and collect_options_data.yml for why the options
# side runs every 30 minutes instead.
#
# '30 12 * * 1-5' = 12:30 UTC, Monday-Friday.
#
# NOTE: NSE market holidays (Diwali, Republic Day, etc.) mean some
# scheduled runs will find "no new data" because Yahoo Finance has
# nothing new to report either — that's expected, not a failure. See
# README.md.
on:
  schedule:
    - cron: '30 12 * * 1-5'
  workflow_dispatch:  # allows manual "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest changes
        # Same reasoning as in collect_options_data.yml: both workflows
        # write to the same database file, so we pull the latest version
        # before reading/writing it ourselves.
        run: git pull --rebase origin main

      - name: Update equity prices (incremental)
        run: python 01_equity_prices.py --incremental

      - name: Update index prices (incremental)
        run: python 02_index_prices.py --incremental

      - name: Commit and push if there is new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market_data.db
          if git diff --staged --quiet; then
            echo "No new daily bars (likely a market holiday or Yahoo Finance hasn't published today's bar yet). Skipping commit."
            exit 0
          fi
          git commit -m "Update daily equity/index prices $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
